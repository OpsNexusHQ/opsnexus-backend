name: Compatibility Deployment

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-deployment:
    name: ci/compatibility-deployment
    uses: OpsNexusHQ/opsnexus-deployment/.github/workflows/ci-compatibility-deployment.yml@7d1b2a880de68e9dcdfa2348e71779d6efa56045
    with:
      pr_repo: opsnexus-backend
      pr_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      base_manifest_sha: b54bde59f0e4c581e1362c520882730040e90b1d # immutable opsnexus-docs main manifest baseline
