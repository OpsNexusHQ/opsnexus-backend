name: Compatibility Modules

on:
  pull_request:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - '**/*.go'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-modules:
    name: ci/compatibility-modules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out backend repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out immutable base manifest
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: OpsNexusHQ/opsnexus-docs
          ref: f692608bfe837f19625cc4f7208aee70c1fdfc43
          path: ci-source/opsnexus-docs-base
          persist-credentials: false

      - name: Check out immutable compatibility resolver
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: OpsNexusHQ/opsnexus-docs
          ref: faf783529ea6f45a4d156e7b98309eb1bd506e49
          path: ci-source/opsnexus-docs-tools
          persist-credentials: false

      - name: Resolve compatibility set
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          pr_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          python3 ci-source/opsnexus-docs-tools/scripts/resolve_compatibility_set.py \
            --manifest ci-source/opsnexus-docs-base/engineering/releases/platform-compatibility.yaml \
            --pr-repo opsnexus-backend \
            --pr-sha "$pr_sha" \
            --github-output "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Print selected relationship
        run: |
          echo "component=opsnexus-backend version=$(sed -n 's/^go \(.*\)$/\1/p' go.mod | head -1)"
          echo "common=github.com/OpsNexusHQ/opsnexus-common commit=${{ steps.resolve.outputs.common_sha }}"

      - name: Validate selected common module in an isolated copy
        env:
          COMMON_SHA: ${{ steps.resolve.outputs.common_sha }}
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          python3 ci-source/opsnexus-docs-tools/scripts/validate_go_module_compatibility.py \
            --common-sha "$COMMON_SHA" \
            --consumer .
